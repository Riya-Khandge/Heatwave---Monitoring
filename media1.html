<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Heatwave Awareness</title>

<style>

body {
    background-color: lightblue;
}

h1 {
    background-color: darkred;
    color: white;
    padding: 15px;
}

h2 {
    color: darkblue;
}

.section {
    background-color: white;
    padding: 15px;
    margin: 15px;
}

.message {
    background-color: orange;
    color: darkred;
    font-size: 28px;
    font-weight: bold;
    text-align: center;

    padding: 20px;
    margin: 20px;

    border-radius: 10px;

    /* Glow */
    box-shadow: 0 0 20px orange;
    text-shadow: 2px 2px 5px white;

    /* Blinking/Glowing animation */
    animation: glow 1.5s infinite alternate;
}

/* Animation */
@keyframes glow {
    from {
        box-shadow: 0 0 5px orange;
    }

    to {
        box-shadow: 0 0 30px red;
    }
}

</style>

</head>

<body>

<h1>Heatwave Awareness & Media</h1>

<!-- Message Box -->
<div class="message">
     Important Message : Stay Safe During Heatwaves! 
</div>

<div class="section">

<h2>Heatwave Awareness Video</h2>

<video width="500" controls>
    <source src="heatwave-awareness1.mp4" type="video/mp4">
    Your browser does not support the video element.
</video>

</div>

<div class="section">

<h2>Audio Advisory</h2>

<audio controls>
    <source src="heatwave-advisory.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

</div>

<div class="section">

<h2>Regional Heatwave Map</h2>

<iframe src="https://www.google.com/maps"
        width="600"
        height="400">
</iframe>

</div>

<noscript>

<p style="background-color: yellow; padding: 10px;">
JavaScript is disabled in your browser. Some features of this Heatwave Awareness page may not work correctly.
</p>

</noscript>

</body>
</html>
