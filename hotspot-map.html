<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotspot Map</title>
</head>
<body>

<h1>Regional Heatwave Hotspot Map</h1>

<p>Click on a region to view its heatwave details.</p>

<img src="regional-map.jpg"
     alt="Regional Heatwave Map"
     usemap="#heatwaveMap"
     width="600">

<map name="heatwaveMap">

    <!-- Region A - North Zone -->
    <area shape="rect"
          coords="100,50,300,200"
          href="north-zone.html"
          alt="North Zone"
          title="North Zone">

    <!-- Region B - Central Zone -->
    <area shape="rect"
          coords="150,200,400,350"
          href="central-zone.html"
          alt="Central Zone"
          title="Central Zone">
  
   <!-- Region C - South Zone -->
    <area shape="rect"
          coords="180,350,400,550"
          href="south-zone.html"
          alt="South Zone"
          title="South Zone">


</map>

</body>
</html>
