<!DOCTYPE html>
<html>
<head>
    <title>Advisory Subscription</title>
</head>
<body>

<h1>Heatwave Advisory Subscription</h1>

<form>

<label>Name:</label><br>
<input type="text" name="name"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br><br>

<label>Mobile Number:</label><br>
<input type="tel" name="mobile"><br><br>

<label>Select Region:</label><br>

<select>

<option>North</option>
<option>Central</option>
<option>South</option>
<option>West</option>

</select>

<br><br>

Preferred Language<br>

<input type="radio" name="language"> English

<input type="radio" name="language"> Hindi

<br><br>

Alert Types<br>

<input type="checkbox"> Heatwave Alert

<input type="checkbox"> Weather Forecast

<input type="checkbox"> Emergency Advisory

<br><br>

<input type="submit" value="Subscribe">

<input type="reset" value="Reset">

</form>

</body>
</html>
