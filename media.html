<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heatwave Awareness</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            background-color: darkred;
            color: white;
            padding: 15px;
        }

        h2 {
            color: darkblue;
        }

        .section {
            background-color: white;
            padding: 15px;
            margin: 15px;
        }
    </style>
</head>

<body>

<h1>Heatwave Awareness & Media</h1>

<div class="section">

    <h2>Heatwave Awareness Video</h2>

    <video width="500" controls>

        Your browser does not support the video element.
    </video>

</div>


<div class="section">

    <h2>Audio Advisory</h2>

    <audio controls>
        <source src="heatwave-advisory.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

</div>


<div class="section">

    <h2>Regional Heatwave Map</h2>

    <iframe src="https://www.google.com/maps"
         width="600" 
         height="400"> 
    </iframe>

</div>


<noscript>
    <p style="background-color: yellow; padding: 10px;">
          JavaScript is disabled in your browser. Some features of this Heatwave Awareness page may not work correctly.
            </p>
</noscript>

</html>
